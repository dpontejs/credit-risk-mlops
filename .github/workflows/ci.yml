name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel an older run of the same branch/PR when a new commit arrives.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      # --locked fails if uv.lock is out of date with pyproject.toml, instead of silently
      # resolving new versions: CI tests exactly what was committed.
      - name: Install dependencies
        run: uv sync --locked --all-groups

      # Same hooks as the local commit hook (ruff, mypy, nbstripout, large files, private keys),
      # over every tracked file: catches commits made with --no-verify or without the hook installed.
      - name: Pre-commit (lint, format, types, file checks)
        run: uv run pre-commit run --all-files --show-diff-on-failure

      - name: Tests
        run: uv run pytest
